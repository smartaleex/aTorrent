# Deploy to Fly.io:  fly launch --copy-config --no-deploy
#                    fly volume create atorrent_data --size 10
#                    fly secrets set ATORRENT_PASSWORD=something
#                    fly deploy
app = "atorrent"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # A torrent client that is stopped is a torrent client that is not
  # downloading, so this machine stays up rather than idling out.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "atorrent_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
